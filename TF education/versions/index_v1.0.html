<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 질의응답</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f6fa; color: #222; min-height: 100vh; }

  header {
    background: #1e3a5f;
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: .02em; }
  #status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .85rem;
  }
  #dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #aaa;
    transition: background .3s;
  }
  #dot.ok  { background: #4caf50; }
  #dot.err { background: #f44336; }

  main {
    max-width: 860px;
    margin: 32px auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
    padding: 20px;
  }
  .card label {
    display: block;
    font-size: .8rem;
    font-weight: 600;
    color: #555;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  textarea {
    width: 100%;
    border: 1.5px solid #dde1ea;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: .95rem;
    font-family: inherit;
    resize: vertical;
    transition: border-color .2s;
    background: #fafbfd;
  }
  textarea:focus { outline: none; border-color: #1e3a5f; background: #fff; }

  #question { min-height: 72px; }
  #context  { min-height: 160px; }

  button {
    width: 100%;
    padding: 13px;
    background: #1e3a5f;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .2s, opacity .2s;
  }
  button:hover:not(:disabled) { background: #16304f; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  #answer-box {
    min-height: 180px;
    border: 1.5px solid #dde1ea;
    border-radius: 8px;
    padding: 14px;
    background: #fafbfd;
    font-size: .95rem;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    color: #222;
  }
  #answer-box.empty { color: #aaa; font-style: italic; }
  #answer-box.streaming { border-color: #1e3a5f; }

  .cursor {
    display: inline-block;
    width: 2px; height: 1em;
    background: #1e3a5f;
    animation: blink .7s steps(1) infinite;
    vertical-align: text-bottom;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .row-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .row-label label { margin-bottom: 0; }
  #clear-btn {
    background: none;
    border: none;
    color: #888;
    font-size: .8rem;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    width: auto;
    font-weight: 400;
  }
  #clear-btn:hover { background: #f0f0f0; color: #444; }
</style>
</head>
<body>

<header>
  <h1>AI 질의응답</h1>
  <div id="status">
    <div id="dot"></div>
    <span id="status-text">연결 확인 중…</span>
  </div>
</header>

<main>
  <div class="card">
    <label for="context">참고 자료</label>
    <textarea id="context" placeholder="AI가 참고할 자료(문서, 내용 등)를 여기에 붙여넣으세요."></textarea>
  </div>

  <div class="card">
    <label for="question">질문</label>
    <textarea id="question" placeholder="질문을 입력하세요." rows="3"></textarea>
    <button id="send-btn" style="margin-top:14px;" onclick="sendQuestion()">질문하기</button>
  </div>

  <div class="card">
    <div class="row-label">
      <label>답변</label>
      <button id="clear-btn" onclick="clearAnswer()">지우기</button>
    </div>
    <div id="answer-box" class="empty">답변이 여기에 표시됩니다.</div>
  </div>
</main>

<script>
  // ── 주소 설정 (이 변수 하나만 수정하면 됨) ──────────────────────────
  const BE = "http://127.0.0.1:8000";
  // ────────────────────────────────────────────────────────────────────

  const dot        = document.getElementById("dot");
  const statusText = document.getElementById("status-text");
  const sendBtn    = document.getElementById("send-btn");
  const answerBox  = document.getElementById("answer-box");

  // 시작 시 헬스 체크
  async function checkHealth() {
    try {
      const res = await fetch(BE + "/health");
      if (res.ok) {
        dot.className = "ok";
        statusText.textContent = "백엔드 연결됨";
      } else {
        throw new Error();
      }
    } catch {
      dot.className = "err";
      statusText.textContent = "백엔드 연결 실패";
    }
  }
  checkHealth();

  function clearAnswer() {
    answerBox.textContent = "답변이 여기에 표시됩니다.";
    answerBox.className = "empty";
  }

  async function sendQuestion() {
    const question = document.getElementById("question").value.trim();
    const context  = document.getElementById("context").value.trim();

    if (!question) {
      alert("질문을 입력해 주세요.");
      return;
    }

    sendBtn.disabled = true;
    answerBox.className = "streaming";
    answerBox.innerHTML = '<span class="cursor"></span>';

    let accumulated = "";

    try {
      const res = await fetch(BE + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, context }),
      });

      if (!res.ok) throw new Error(`서버 오류: ${res.status}`);

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let   buffer  = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop(); // 마지막 미완성 줄 보류

        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const raw = line.slice(5).trim();
          if (raw === "[DONE]") break;
          try {
            const { token } = JSON.parse(raw);
            accumulated += token;
            answerBox.innerHTML =
              accumulated.replace(/</g, "&lt;").replace(/>/g, "&gt;")
              + '<span class="cursor"></span>';
          } catch { /* 파싱 실패 무시 */ }
        }
      }

      // 커서 제거, 최종 텍스트
      answerBox.textContent = accumulated || "응답 없음";
      answerBox.className = "";

    } catch (err) {
      answerBox.textContent = "오류: " + err.message;
      answerBox.className = "err";
      dot.className = "err";
      statusText.textContent = "요청 실패";
    } finally {
      sendBtn.disabled = false;
    }
  }

  // Enter(Ctrl+Enter)로 질문 전송
  document.getElementById("question").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendQuestion();
  });
</script>

</body>
</html>
