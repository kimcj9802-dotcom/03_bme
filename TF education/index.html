<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>의료기기 수리 매뉴얼 챗봇 (DI-2200P)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; color: #222; min-height: 100vh; }

  header {
    background: #0d3b6e;
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: .01em; }
  header .subtitle { font-size: .75rem; color: #a8c4e0; margin-top: 2px; }

  #status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .82rem;
    white-space: nowrap;
  }
  #dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #aaa;
    transition: background .3s;
    flex-shrink: 0;
  }
  #dot.ok  { background: #4caf50; }
  #dot.err { background: #f44336; }

  main {
    max-width: 900px;
    margin: 28px auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
    padding: 18px 20px;
  }
  .card-label {
    font-size: .75rem;
    font-weight: 700;
    color: #0d3b6e;
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    border: 1.5px solid #d0d8e4;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: .9rem;
    font-family: inherit;
    resize: vertical;
    transition: border-color .2s;
    background: #fafbfd;
    line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: #0d3b6e; background: #fff; }

  #question { min-height: 68px; }
  #context  { min-height: 240px; font-size: .82rem; color: #333; }

  .context-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  #reset-ctx {
    font-size: .75rem;
    color: #0d3b6e;
    background: none;
    border: 1px solid #0d3b6e;
    border-radius: 5px;
    padding: 2px 8px;
    cursor: pointer;
    width: auto;
  }
  #reset-ctx:hover { background: #e8f0fb; }

  button {
    width: 100%;
    padding: 13px;
    background: #0d3b6e;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .2s, opacity .2s;
  }
  button:hover:not(:disabled) { background: #0a2f58; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  #answer-box {
    min-height: 180px;
    border: 1.5px solid #d0d8e4;
    border-radius: 8px;
    padding: 14px;
    background: #fafbfd;
    font-size: .93rem;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
    color: #222;
  }
  #answer-box.empty { color: #aaa; font-style: italic; }
  #answer-box.streaming { border-color: #0d3b6e; }
  #answer-box.err-state { border-color: #f44336; color: #c00; }

  .cursor {
    display: inline-block;
    width: 2px; height: 1em;
    background: #0d3b6e;
    animation: blink .7s steps(1) infinite;
    vertical-align: text-bottom;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .answer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  #clear-btn {
    background: none;
    border: none;
    color: #888;
    font-size: .78rem;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    width: auto;
    font-weight: 400;
  }
  #clear-btn:hover { background: #f0f0f0; color: #444; }

  /* 리콜 대조 */
  .recall-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 600px) { .recall-grid { grid-template-columns: 1fr; } }
  .recall-grid label { font-size: .75rem; font-weight: 600; color: #555; display: block; margin-bottom: 4px; }
  .recall-grid textarea { min-height: 120px; font-size: .8rem; }
  #recall-btn {
    margin-top: 12px;
    background: #1a6b3a;
  }
  #recall-btn:hover:not(:disabled) { background: #145730; }
  .source-chip {
    display: inline-block;
    margin-top: 8px;
    font-size: .75rem;
    padding: 3px 10px;
    border: 1px solid #1a6b3a;
    border-radius: 12px;
    color: #1a6b3a;
    background: #edf7f1;
  }

  /* 바이브 ↔ 하네스 토글 */
  .mode-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }
  .mode-label { font-size: .8rem; color: #555; }
  .toggle-wrap {
    display: flex;
    border: 2px solid #0d3b6e;
    border-radius: 8px;
    overflow: hidden;
    font-size: .8rem;
    font-weight: 700;
  }
  .toggle-wrap button {
    padding: 5px 14px;
    border: none;
    border-radius: 0;
    cursor: pointer;
    width: auto;
    font-weight: 700;
    font-size: .8rem;
    transition: background .15s, color .15s;
  }
  .toggle-wrap .t-vibe  { background: #fff; color: #0d3b6e; }
  .toggle-wrap .t-harn  { background: #fff; color: #0d3b6e; }
  .toggle-wrap .t-active { background: #0d3b6e; color: #fff; }

  /* 출처 영역 */
  #sources-box {
    display: none;
    margin-top: 10px;
    padding: 8px 12px;
    background: #eef3fb;
    border-left: 3px solid #0d3b6e;
    border-radius: 0 6px 6px 0;
    font-size: .78rem;
    color: #1a3a6b;
    line-height: 2;
  }
  #sources-box strong { font-weight: 700; }
  .src-chip {
    display: inline-block;
    background: #fff;
    border: 1px solid #a8c0e0;
    border-radius: 12px;
    padding: 1px 10px;
    margin: 2px 4px 2px 0;
    font-size: .75rem;
    color: #0d3b6e;
    white-space: nowrap;
  }
  .src-chip em { font-style: normal; color: #5580b0; }

  /* 빠른 질문 칩 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip {
    font-size: .78rem;
    padding: 4px 12px;
    border: 1.5px solid #0d3b6e;
    border-radius: 20px;
    color: #0d3b6e;
    background: #f0f5fc;
    cursor: pointer;
    transition: background .15s;
    width: auto;
    font-weight: 500;
  }
  .chip:hover { background: #dce8f8; }

  /* 오류 코드 빠른 검색 패널 */
  .err-search-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  #err-code-input {
    flex: 1;
    min-width: 120px;
    max-width: 200px;
    border: 1.5px solid #d0d8e4;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: .92rem;
    font-family: inherit;
    background: #fafbfd;
    text-transform: uppercase;
    letter-spacing: .06em;
    transition: border-color .2s;
  }
  #err-code-input:focus { outline: none; border-color: #b03a2e; background: #fff; }
  #err-search-btn {
    width: auto;
    padding: 8px 18px;
    font-size: .88rem;
    font-weight: 700;
    background: #b03a2e;
    border-radius: 8px;
    white-space: nowrap;
  }
  #err-search-btn:hover:not(:disabled) { background: #922e24; }
  .err-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .err-chip {
    font-size: .82rem;
    padding: 5px 16px;
    border: 2px solid #b03a2e;
    border-radius: 20px;
    color: #b03a2e;
    background: #fdf2f1;
    cursor: pointer;
    transition: background .15s, color .15s;
    width: auto;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .err-chip:hover { background: #b03a2e; color: #fff; }
</style>
</head>
<body>

<header>
  <div>
    <div class="h1-wrap">
      <h1>의료기기 수리 매뉴얼 챗봇 (DI-2200P)</h1>
    </div>
    <div class="subtitle">주입펌프 수리 안내 · 참고 자료 기반 응답</div>
  </div>
  <div id="status">
    <div id="dot"></div>
    <span id="status-text">연결 확인 중…</span>
  </div>
</header>

<main>

  <!-- 오류 코드 빠른 검색 -->
  <div class="card">
    <div class="card-label">⚠ 오류 코드 빠른 검색</div>
    <div class="err-search-row">
      <input id="err-code-input" type="text" placeholder="예) E12" maxlength="6"
             onkeydown="if(event.key==='Enter') searchErrCode()" />
      <button id="err-search-btn" onclick="searchErrCode()">코드 검색</button>
    </div>
    <div class="err-chips">
      <button class="err-chip" onclick="searchErrCode('E12')">E12</button>
      <button class="err-chip" onclick="searchErrCode('E15')">E15</button>
      <button class="err-chip" onclick="searchErrCode('E21')">E21</button>
      <button class="err-chip" onclick="searchErrCode('E33')">E33</button>
    </div>
  </div>

  <!-- 참고 자료 -->
  <div class="card">
    <div class="context-header">
      <div class="card-label">참고 자료 (매뉴얼 발췌)</div>
      <button id="reset-ctx" onclick="resetContext()">기본값 복원</button>
    </div>
    <textarea id="context"></textarea>
  </div>

  <!-- 질문 -->
  <div class="card">
    <div class="mode-bar">
      <span class="mode-label">응답 모드:</span>
      <div class="toggle-wrap">
        <button class="t-vibe" id="btn-vibe" onclick="setMode(true)">⚡ 바이브</button>
        <button class="t-harn t-active" id="btn-harn" onclick="setMode(false)">🔍 하네스</button>
      </div>
      <span class="mode-label" id="mode-desc">검색 + 출처 표시</span>
    </div>
    <textarea id="question" placeholder="예) 폐색 알람이 울리면 어떻게 해야 하나요?"></textarea>
    <!-- 빠른 질문 칩 -->
    <div class="chips">
      <button class="chip" onclick="setQ('폐색 알람(AL-OCC)이 발생했을 때 조치 방법은?')">폐색 알람 조치</button>
      <button class="chip" onclick="setQ('공기 알람(AL-AIR) 발생 시 어떻게 처리하나요?')">공기 알람 처리</button>
      <button class="chip" onclick="setQ('E15 오류 코드의 의미와 대처법을 알려줘.')">E15 오류 대처</button>
      <button class="chip" onclick="setQ('배터리 교체 기준이 어떻게 되나요?')">배터리 교체 기준</button>
      <button class="chip" onclick="setQ('소독 및 세척 절차를 알려줘.')">세척·소독 절차</button>
      <button class="chip" onclick="setQ('정기 점검 항목을 알려줘.')">정기 점검 항목</button>
    </div>
    <button id="send-btn" style="margin-top:14px;" onclick="sendQuestion()">질문하기</button>
  </div>

  <!-- 리콜 대조 -->
  <div class="card">
    <div class="card-label">리콜 대조</div>
    <div class="recall-grid">
      <div>
        <label>보유 기기 목록 (JSON)</label>
        <textarea id="recall-inventory">[
  {"model":"DI-2200P","lot":"L2401"},
  {"model":"DI-2200P","lot":"L2402"}
]</textarea>
      </div>
      <div>
        <label>리콜 공지 목록 (JSON)</label>
        <textarea id="recall-notice">[
  {"model":"DI-2200P","lot":"L2401","reason":"압력센서 결함"}
]</textarea>
      </div>
    </div>
    <button id="recall-btn" onclick="runRecallCheck()">리콜 대조 실행</button>
  </div>

  <!-- 답변 -->
  <div class="card">
    <div class="answer-header">
      <div class="card-label">답변</div>
      <button id="clear-btn" onclick="clearAnswer()">지우기</button>
    </div>
    <div id="answer-box" class="empty">답변이 여기에 표시됩니다.</div>
    <div id="sources-box"></div>
    <div id="source-chip" style="display:none;" class="source-chip">근거: /api/recall-check 코드 계산값</div>
  </div>

</main>

<script>
  // ── 주소 설정 (이 변수 하나만 수정하면 됨) ──────────────────────────
  const BE = "http://127.0.0.1:8000";
  // ────────────────────────────────────────────────────────────────────

  const DEFAULT_CONTEXT = `[DI-2200P 주입펌프 수리 매뉴얼 발췌 — 샘플]

1) 폐색 알람(Occlusion / 알람코드 AL-OCC) — p.42
증상: 주입 중 "폐색" 경고음과 함께 펌프 정지.
점검: ① 라인 꺾임·눌림 확인 ② 클램프(잠금) 열림 확인 ③ 필터·삼방활전 막힘 확인.
조치: 막힌 원인 해소 후 [재개] 버튼. 해소 후에도 지속되면 압력센서 점검 대상 → 서비스 요청.

2) 압력 상승 경고(High Pressure / 알람코드 AL-PRS) — p.43
증상: 주입압이 설정 상한을 넘으면 경고.
점검: 카테터 위치·환자 자세·라인 길이 확인, 점도 높은 약액 여부 확인.
조치: 원인 제거 후 압력 상한 재설정. 반복되면 압력센서 캘리브레이션 필요(자격 기술자).

3) 배터리 점검·교체 — p.61
기준: 완충 후 연속 사용시간 표시 확인.
만충 대비 80% 미만이면 배터리 교체 대상.
주의: 정품 배터리만 사용, 임의 분해 금지.
교체 후 충전 사이클 1회 권장.

4) 센서 오류 코드 모음 — p.78
E12: 공기방울 감지센서 커넥터 접촉 불량 → 커넥터 재결합 후 전원 재시작.
E15: 압력센서 신호 불안정 → 캘리브레이션 필요(자격 기술자 전용).
E21: 도어 닫힘 감지 실패 → 도어 래치·자석 위치 확인.
E33: 내부 온도 과열 → 통풍구 확인, 30분 냉각 후 재가동.

5) 공기 알람(Air-in-line / 알람코드 AL-AIR) — p.45
증상: 라인 내 기포 감지 시 정지.
점검: 챔버 액위, 라인 프라이밍 상태, 센서 창 오염 확인.
조치: 라인 재프라이밍·기포 제거 후 재개. 센서 창 이물은 마른 천으로 닦기.

6) 세척·소독 절차 — p.90
외장: 전원 차단 후 중성세제 적신 천으로 닦고 건조. 분무·침수 금지.
소독: 70% 알코올 천 사용 가능, 화면·센서 창은 강한 용제 금지.
주기: 환자 교체 시마다 외장 소독 권장.

7) 정기 점검 항목 — p.102
일일: 알람음·화면 표시·배터리 잔량 확인.
월간: 압력센서 동작, 도어 래치, 충전 상태 점검.
연간: 압력센서 캘리브레이션, 누설전류 측정(자격 기술자·점검 기록보관).

8) 작업 안전 원칙 — p.7
본 매뉴얼의 점검·조치는 자격 갖춘 기술자 전용. 임의 분해·내부 회로 수리·부품 개조 금지. 의심 시 제조사 서비스 요청.
환자 연결 상태에서의 점검은 금지(반드시 라인 분리 후).`;

  const dot        = document.getElementById("dot");
  const statusText = document.getElementById("status-text");
  const sendBtn    = document.getElementById("send-btn");
  const answerBox  = document.getElementById("answer-box");
  const ctxArea    = document.getElementById("context");

  // 참고 자료 기본값 채우기
  ctxArea.value = DEFAULT_CONTEXT;

  function resetContext() {
    ctxArea.value = DEFAULT_CONTEXT;
  }

  function setQ(text) {
    document.getElementById("question").value = text;
    document.getElementById("question").focus();
  }

  // 시작 시 헬스 체크
  async function checkHealth() {
    try {
      const res = await fetch(BE + "/health");
      if (res.ok) {
        dot.className = "ok";
        statusText.textContent = "백엔드 연결됨";
      } else throw new Error();
    } catch {
      dot.className = "err";
      statusText.textContent = "백엔드 연결 실패";
    }
  }
  checkHealth();

  function clearAnswer() {
    answerBox.textContent = "답변이 여기에 표시됩니다.";
    answerBox.className = "empty";
  }

  async function sendQuestion() {
    const question = document.getElementById("question").value.trim();
    const context  = ctxArea.value.trim();

    if (!question) {
      alert("질문을 입력해 주세요.");
      return;
    }

    const sourcesBox = document.getElementById("sources-box");
    sendBtn.disabled = true;
    answerBox.className = "streaming";
    answerBox.innerHTML = '<span class="cursor"></span>';
    sourcesBox.style.display = "none";
    sourcesBox.innerHTML = "";

    let accumulated = "";

    try {
      const res = await fetch(BE + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, context, bare: bareMode }),
      });

      if (!res.ok) throw new Error(`서버 오류: ${res.status}`);

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let   buffer  = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const raw = line.slice(5).trim();
          if (raw === "[DONE]") break;
          if (raw === "[DONE]") continue;   // [DONE] 이후 같은 청크에 sources 있을 수 있으므로 continue
          try {
            const parsed = JSON.parse(raw);
            if (parsed.sources) {
              // 토큰 스트림 끝에 오는 출처 이벤트
              const chips = parsed.sources.map(s =>
                `<span class="src-chip">${s.title}${s.page ? ' <em>(' + s.page + ')</em>' : ''}</span>`
              ).join(" ");
              sourcesBox.innerHTML = `<strong>📎 근거</strong>&nbsp; ${chips}`;
              sourcesBox.style.display = "block";
            } else {
              const token = parsed.token ?? "";
              accumulated += token;
              answerBox.innerHTML =
                accumulated.replace(/</g, "&lt;").replace(/>/g, "&gt;")
                + '<span class="cursor"></span>';
            }
          } catch { /* 파싱 실패 무시 */ }
        }
      }

      answerBox.textContent = accumulated || "응답 없음";
      answerBox.className = "";

    } catch (err) {
      answerBox.textContent = "오류: " + err.message;
      answerBox.className = "err-state";
      dot.className = "err";
      statusText.textContent = "요청 실패";
    } finally {
      sendBtn.disabled = false;
    }
  }

  document.getElementById("question").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendQuestion();
  });

  // ── 바이브 ↔ 하네스 토글 ──────────────────────────────────────────
  let bareMode = false;   // false = 하네스(기본), true = 바이브

  function setMode(vibe) {
    bareMode = vibe;
    document.getElementById("btn-vibe").classList.toggle("t-active",  vibe);
    document.getElementById("btn-harn").classList.toggle("t-active", !vibe);
    document.getElementById("mode-desc").textContent =
      vibe ? "모델 직접 호출 (출처 없음)" : "검색 + 출처 표시";
  }

  // ── 오류 코드 빠른 검색 ───────────────────────────────────────────
  function searchErrCode(code) {
    const raw = (code ?? document.getElementById("err-code-input").value).trim().toUpperCase();
    if (!raw) { alert("오류 코드를 입력하거나 칩을 선택하세요."); return; }
    // 하네스 모드 강제
    if (bareMode) setMode(false);
    document.getElementById("question").value =
      `오류 코드 ${raw}의 의미와 조치를 매뉴얼 근거로 알려줘.`;
    document.getElementById("err-code-input").value = raw;
    sendQuestion();
  }

  // ── 리콜 대조 ─────────────────────────────────────────────────────
  async function runRecallCheck() {
    let inventory, recallNotice;
    try {
      inventory    = JSON.parse(document.getElementById("recall-inventory").value);
      recallNotice = JSON.parse(document.getElementById("recall-notice").value);
    } catch {
      alert("JSON 형식이 올바르지 않습니다. 입력값을 확인해 주세요.");
      return;
    }

    const recallBtn  = document.getElementById("recall-btn");
    const sourceChip = document.getElementById("source-chip");

    recallBtn.disabled = true;
    sourceChip.style.display = "none";
    answerBox.className = "streaming";
    answerBox.innerHTML = '<span class="cursor"></span>';

    let accumulated = "";

    try {
      const res = await fetch(BE + "/api/recall-check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ inventory, recall_notice: recallNotice }),
      });

      if (!res.ok) throw new Error(`서버 오류: ${res.status}`);

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let   buffer  = "";
      let   metaInfo = null;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const raw = line.slice(5).trim();
          if (raw === "[DONE]") break;
          try {
            const parsed = JSON.parse(raw);
            if (parsed.type === "meta") {
              // 파이썬 계산값 — 모델이 아닌 코드가 낸 확정값
              metaInfo = parsed;
            } else {
              const token = parsed.token || "";
              accumulated += token;
              answerBox.innerHTML =
                accumulated.replace(/</g, "&lt;").replace(/>/g, "&gt;")
                + '<span class="cursor"></span>';
            }
          } catch { /* 파싱 실패 무시 */ }
        }
      }

      answerBox.textContent = accumulated || "응답 없음";
      answerBox.className = "";
      // 출처 칩: 계산 요약도 함께 표시
      if (metaInfo) {
        sourceChip.textContent =
          `근거: /api/recall-check 코드 계산값 — ` +
          `대상 ${metaInfo.matched}건(${metaInfo.matched_lots.join(", ") || "없음"}), ` +
          `대상 아님 ${metaInfo.safe}건(${metaInfo.safe_lots.join(", ") || "없음"})`;
      }
      sourceChip.style.display = "inline-block";

    } catch (err) {
      answerBox.textContent = "오류: " + err.message;
      answerBox.className = "err-state";
      dot.className = "err";
      statusText.textContent = "요청 실패";
    } finally {
      recallBtn.disabled = false;
    }
  }
</script>

</body>
