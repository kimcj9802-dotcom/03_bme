<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 질의응답</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 32px;
    width: 100%;
    max-width: 760px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  h1 { font-size: 1.4rem; font-weight: 700; color: #1a1a2e; }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: #666;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #ccc;
    transition: background 0.4s;
  }
  .dot.ok  { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .dot.err { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
  .dot.checking { background: #f59e0b; animation: pulse 1s infinite; }

  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.3; }
  }

  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: #555;
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }

  .section { margin-bottom: 20px; }

  textarea {
    width: 100%;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
    transition: border-color 0.2s;
    background: #fafafa;
    color: #1a1a2e;
  }
  textarea:focus {
    outline: none;
    border-color: #6366f1;
    background: #fff;
  }

  #question  { min-height: 72px; }
  #context   { min-height: 130px; }

  button {
    width: 100%;
    padding: 13px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.02em;
  }
  button:hover:not(:disabled) { background: #4f46e5; }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { background: #a5b4fc; cursor: not-allowed; }

  .answer-wrap {
    margin-top: 24px;
    border-top: 1.5px solid #f0f0f0;
    padding-top: 20px;
  }

  #answer {
    min-height: 80px;
    background: #f8fafc;
    border-radius: 10px;
    padding: 16px;
    font-size: 0.97rem;
    line-height: 1.75;
    color: #1a1a2e;
    white-space: pre-wrap;
    word-break: break-word;
  }

  #answer.empty { color: #aaa; font-style: italic; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #c7d2fe;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-left: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 8px; }
</style>
</head>
<body>

<div class="card">
  <header>
    <h1>AI 질의응답</h1>
    <div class="status">
      <div class="dot checking" id="dot"></div>
      <span id="statusText">연결 확인 중…</span>
    </div>
  </header>

  <div class="section">
    <label for="context">📄 참고 자료</label>
    <textarea id="context" placeholder="AI가 참고할 문서·텍스트를 붙여넣으세요."></textarea>
  </div>

  <div class="section">
    <label for="question">💬 질문</label>
    <textarea id="question" placeholder="질문을 입력하세요."></textarea>
  </div>

  <button id="sendBtn" onclick="sendChat()">질문 보내기</button>
  <div id="errorMsg" class="error-msg"></div>

  <div class="answer-wrap">
    <label>🤖 답변</label>
    <div id="answer" class="empty">답변이 여기에 표시됩니다.</div>
  </div>
</div>

<script>
// ── 주소 설정 ──────────────────────────────────────────────
const BE = "http://127.0.0.1:8000";
// ──────────────────────────────────────────────────────────

const dot        = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const answerEl   = document.getElementById("answer");
const sendBtn    = document.getElementById("sendBtn");
const errorMsg   = document.getElementById("errorMsg");

// 연결 상태 확인
async function checkHealth() {
  dot.className = "dot checking";
  statusText.textContent = "연결 확인 중…";
  try {
    const res = await fetch(BE + "/health");
    if (res.ok) {
      dot.className = "dot ok";
      statusText.textContent = "백엔드 연결됨";
    } else {
      throw new Error();
    }
  } catch {
    dot.className = "dot err";
    statusText.textContent = "백엔드 연결 실패";
  }
}

// SSE 스트리밍 채팅
async function sendChat() {
  const question = document.getElementById("question").value.trim();
  const context  = document.getElementById("context").value.trim();

  errorMsg.textContent = "";

  if (!question) {
    errorMsg.textContent = "질문을 입력해 주세요.";
    return;
  }

  sendBtn.disabled = true;
  sendBtn.innerHTML = '답변 생성 중<span class="spinner"></span>';
  answerEl.className = "";
  answerEl.textContent = "";

  try {
    const res = await fetch(BE + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, context }),
    });

    if (!res.ok) {
      throw new Error(`서버 오류 (${res.status})`);
    }

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop(); // 마지막 불완전 줄 보관

      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const raw = line.slice(5).trim();
        if (raw === "[DONE]") break;
        try {
          const { token } = JSON.parse(raw);
          if (token) answerEl.textContent += token;
        } catch { /* 파싱 실패 무시 */ }
      }
    }

    if (!answerEl.textContent) {
      answerEl.className = "empty";
      answerEl.textContent = "답변을 받지 못했습니다.";
    }
  } catch (err) {
    errorMsg.textContent = "오류: " + err.message;
    dot.className = "dot err";
    statusText.textContent = "요청 실패";
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = "질문 보내기";
  }
}

// Enter(Ctrl+Enter)로 전송
document.getElementById("question").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendChat();
});

// 초기 연결 확인
checkHealth();
</script>
</body>
</html>
